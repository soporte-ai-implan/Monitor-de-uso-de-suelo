  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

    <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <p style=\"font-size:.78rem;color:#8A8178;margin-top:14px\">Mostrando 9 de 34 registros.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:#FBF9F6;border:1px solid #E3DCD2;border-radius:14px;padding:12px 18px;margin-bottom:40px;font-size:.78rem;color:#5C554D\">\n    <span style=\"display:inline-flex;align-items:center;gap:7px;font-weight:700;color:#1B1714\">Tipo de terreno:<\u002Fspan>\n    <i style=\"font-style:normal;display:inline-flex;align-items:center;gap:6px\"><span style=\"width:9px;height:9px;border-radius:3px;display:inline-block;background:#15467A\"><\u002Fspan>Urbano<\u002Fi>\n    <i style=\"font-style:normal;display:inline-flex;align-items:center;gap:6px\"><span style=\"width:9px;height:9px;border-radius:3px;display:inline-block;background:#1A7A47\"><\u002Fspan>Residencial<\u002Fi>\n    <i style=\"font-style:normal;display:inline-flex;align-items:center;gap:6px\"><span style=\"width:9px;height:9px;border-radius:3px;display:inline-block;background:#E95026\"><\u002Fspan>Comercial<\u002Fi>\n    <i style=\"font-style:normal;display:inline-flex;align-items:center;gap:6px\"><span style=\"width:9px;height:9px;border-radius:3px;display:inline-block;background:#C9881E\"><\u002Fspan>Ejidal<\u002Fi>\n    <i style=\"font-style:normal;display:inline-flex;align-items:center;gap:6px\"><span style=\"width:9px;height:9px;border-radius:3px;display:inline-block;background:#5B4B8A\"><\u002Fspan>Rústico<\u002Fi>\n  <\u002Fdiv>\n\n  <!-- ALCANCE DEL MONITOR (reemplaza \"Regla de Oro\") -->\n  <sc-if value=\"{{ showNota }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:#FBF9F6;border:1px solid #E3DCD2;border-radius:24px;padding:32px 40px;margin-bottom:40px;display:flex;align-items:flex-start;gap:24px\">\n    <div style=\"flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(21,70,122,.10);color:#15467A\"><svg class=\"ic\" style=\"width:22px;height:22px\"><use href=\"#ic-compass\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n    <div>\n      <h3 style=\"font-family:'Archivo',sans-serif;font-size:.95rem;font-weight:800;color:#1B1714;margin:0 0 8px\">Alcance de los datos<\u002Fh3>\n      <p style=\"color:#5C554D;font-size:.9rem;line-height:1.7;max-width:760px;margin:0\">Este monitor cubre actualmente 2 portales, Inmuebles24 y Pincali, por lo que no representa el 100% del mercado de suelo en Torreón, sino una muestra representativa de la oferta formal publicada en línea.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- METODOLOGÍA -->\n  <div style=\"margin-bottom:20px\">\n    <div style=\"display:flex;align-items:center;font-family:'Archivo',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#E95026;margin-bottom:6px\"><svg class=\"ic\" style=\"width:14px;height:14px;margin-right:7px;stroke-width:2.2\"><use href=\"#ic-compass\"><\u002Fuse><\u002Fsvg>Transparencia metodológica<\u002Fdiv>\n    <h2 style=\"font-family:'Archivo',sans-serif;font-size:1.25rem;font-weight:800;letter-spacing:-.01em;margin:0\">¿Cómo construimos este monitor?<\u002Fh2>\n    <p style=\"font-size:.86rem;color:#5C554D;margin-top:2px;max-width:720px\">Metodología abierta para que cualquier persona entienda de dónde salen los datos. Usar información util y entendible que ayude al ayuntamiento, empresas y ciudadanía es parte del propósito del IMPLAN. El proceso que se utilizo para realizar este monitor se le conoce como: Pipeline de datos inteligentes HITL (Human in the loop).<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px\">\n    <div style=\"background:#FFFFFF;border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(27,23,20,.06),0 0 0 1px #E3DCD2\">\n      <div style=\"width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(21,70,122,.12);color:#15467A;margin-bottom:12px\"><svg class=\"ic\" style=\"width:23px;height:23px\"><use href=\"#ic-search\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#E95026;margin-bottom:2px\">Paso 1<\u002Fdiv>\n      <h4 style=\"font-family:'Archivo',sans-serif;font-size:.92rem;font-weight:700;margin:0 0 6px\">Extracción de datos<\u002Fh4>\n      <p style=\"font-size:.78rem;color:#5C554D;line-height:1.55;margin:0\">Un proceso de <b style=\"color:#1B1714\">web scraping<\u002Fb> recorre los portales del directorio y captura, de cada anuncio: precio, superficie, colonia, tipo de tenencia, fecha y enlace original.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(27,23,20,.06),0 0 0 1px #E3DCD2\">\n      <div style=\"width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(26,122,71,.12);color:#1A7A47;margin-bottom:12px\"><svg class=\"ic\" style=\"width:23px;height:23px\"><use href=\"#ic-terminal\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#E95026;margin-bottom:2px\">Paso 2<\u002Fdiv>\n      <h4 style=\"font-family:'Archivo',sans-serif;font-size:.92rem;font-weight:700;margin:0 0 6px\">Scraper en Python<\u002Fh4>\n      <p style=\"font-size:.78rem;color:#5C554D;line-height:1.55;margin:0\">Un scraper desarrollado en <b style=\"color:#1B1714\">Python<\u002Fb> corre de forma automatizada en un entorno aislado (sandbox), recolectando los anuncios publicados en cada portal.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(27,23,20,.06),0 0 0 1px #E3DCD2\">\n      <div style=\"width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(201,136,30,.12);color:#C9881E;margin-bottom:12px\"><svg class=\"ic\" style=\"width:23px;height:23px\"><use href=\"#ic-cpu\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#E95026;margin-bottom:2px\">Paso 3<\u002Fdiv>\n      <h4 style=\"font-family:'Archivo',sans-serif;font-size:.92rem;font-weight:700;margin:0 0 6px\">Refinamiento con IA<\u002Fh4>\n      <p style=\"font-size:.78rem;color:#5C554D;line-height:1.55;margin:0\">Un modelo de lenguaje (<b style=\"color:#1B1714\">LLM<\u002Fb>) limpia, estandariza y clasifica los datos extraídos —de forma automatizada o con revisión manual— antes de integrarse al monitor.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(27,23,20,.06),0 0 0 1px #E3DCD2\">\n      <div style=\"width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(233,80,38,.12);color:#E95026;margin-bottom:12px\"><svg class=\"ic\" style=\"width:23px;height:23px\"><use href=\"#ic-check\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:'Archivo',sans-serif;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#E95026;margin-bottom:2px\">Paso 4<\u002Fdiv>\n      <h4 style=\"font-family:'Archivo',sans-serif;font-size:.92rem;font-weight:700;margin:0 0 6px\">Verificación humana (HITL)<\u002Fh4>\n      <p style=\"font-size:.78rem;color:#5C554D;line-height:1.55;margin:0\">Antes de publicarse, una persona del equipo revisa el resultado final del proceso (<b style=\"color:#1B1714\">Human-in-the-loop<\u002Fb>), confirmando que los datos estén completos y bien clasificados.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid #E3DCD2;padding:24px 40px;text-align:center\">\n  <p style=\"font-size:.78rem;color:#8A8178;line-height:1.8;margin:0\">\n    Instrumento de información pública sin fines de lucro del IMPLAN Torreón — Monitor de Suelo. La información mostrada corresponde a los portales de origen; el IMPLAN no participa ni media en las transacciones.<br>\n    Contacto: <a href=\"mailto:competitividad@trcimplan.gob.mx\">competitividad@trcimplan.gob.mx<\u002Fa>\n    &nbsp;·&nbsp; IMPLAN Torreón © 2026\n  <\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mostrarNotaAlcance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenido&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.waitForChart(0);\n    this.waitForLeaflet(0);\n  }\n\n  waitForChart(tries) {\n    if (window.Chart) { this.initCharts(); return; }\n    if (tries > 50) return;\n    setTimeout(() => this.waitForChart(tries + 1), 100);\n  }\n\n  waitForLeaflet(tries) {\n    if (window.L && window.L.heatLayer) { this.initMapaZonas(); return; }\n    if (tries > 50) return;\n    setTimeout(() => this.waitForLeaflet(tries + 1), 100);\n  }\n\n  initMapaZonas() {\n    const el = document.getElementById('mapaZonas');\n    if (!el || el._rendered) return;\n    el._rendered = true;\n    const L = window.L;\n    const mapa = L.map(el, { scrollWheelZoom: false, zoomControl: true }).setView([25.541, -103.415], 12.5);\n    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(mapa);\n\n    // Tope duro de la mancha urbana de Torreón: nunca al norte/oeste del Río Nazas\n    // (esa franja ya es Gómez Palacio-Lerdo, Durango — fuera del municipio de Torreón).\n    const LIMITES = { latMin: 25.483, latMax: 25.579, lngMin: -103.463, lngMax: -103.356 };\n    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\n    const enLimite = (lat, lng) => [clamp(lat, LIMITES.latMin, LIMITES.latMax), clamp(lng, LIMITES.lngMin, LIMITES.lngMax)];\n\n    // Límites de zona trazados a mano sobre la mancha urbana real (no rectángulos), acotados\n    // por LIMITES para no cruzar el Río Nazas hacia Gómez Palacio-Lerdo, Durango.\n    const ZONAS = [\n      { nombre: 'Centro', count: 10, color: '#15467A', centro: [25.538, -103.413], coords: [[25.549,-103.422],[25.552,-103.408],[25.547,-103.396],[25.536,-103.394],[25.528,-103.403],[25.527,-103.417],[25.534,-103.428],[25.543,-103.430]] },\n      { nombre: 'Norte', count: 9, color: '#E95026', centro: [25.566, -103.418], coords: [[25.552,-103.408],[25.549,-103.422],[25.543,-103.430],[25.548,-103.443],[25.558,-103.455],[25.572,-103.452],[25.579,-103.404],[25.568,-103.388],[25.558,-103.392]] },\n      { nombre: 'Sur', count: 6, color: '#1A7A47', centro: [25.508, -103.404], coords: [[25.528,-103.403],[25.527,-103.417],[25.534,-103.428],[25.524,-103.436],[25.508,-103.430],[25.495,-103.412],[25.492,-103.392],[25.503,-103.378],[25.518,-103.383],[25.527,-103.394]] },\n      { nombre: 'Este', count: 5, color: '#C9881E', centro: [25.541, -103.377], coords: [[25.547,-103.396],[25.536,-103.394],[25.527,-103.394],[25.518,-103.383],[25.522,-103.368],[25.535,-103.358],[25.549,-103.360],[25.560,-103.372],[25.558,-103.392],[25.552,-103.408]] },\n      { nombre: 'Oeste', count: 4, color: '#5B4B8A', centro: [25.530, -103.448], coords: [[25.534,-103.428],[25.543,-103.430],[25.548,-103.443],[25.545,-103.460],[25.532,-103.465],[25.518,-103.458],[25.512,-103.440],[25.520,-103.425],[25.524,-103.436]] }\n    ];\n\n    // TODO(equipo técnico): sustituir ANUNCIOS_EJEMPLO por los anuncios reales ya geocodificados\n    // (mismos campos: zona, color de esa zona, lat, lng, portal, tipo, precio, m2, publicado, url).\n    const ANUNCIOS_EJEMPLO = [\n      { zona: 'Centro', color: '#15467A', lat: 25.545, lng: -103.418, portal: 'Inmuebles24', tipo: 'Urbano', precio: 5420, m2: 450, publicado: '12/06/2026', url: 'https://www.inmuebles24.com/terrenos-en-venta-en-torreon.html' },\n      { zona: 'Centro', color: '#15467A', lat: 25.536, lng: -103.408, portal: 'Pincali', tipo: 'Urbano', precio: 5180, m2: 380, publicado: '25/06/2026', url: 'https://www.pincali.com/venta/terrenos/torreon' },\n      { zona: 'Centro', color: '#15467A', lat: 25.541, lng: -103.424, portal: 'Inmuebles24', tipo: 'Comercial', precio: 5600, m2: 300, publicado: '02/06/2026', url: 'https://www.inmuebles24.com/terrenos-en-venta-en-torreon.html' },\n      { zona: 'Centro', color: '#15467A', lat: 25.532, lng: -103.415, portal: 'Pincali', tipo: 'Urbano', precio: 5050, m2: 410, publicado: '25/06/2026', url: 'https://www.pincali.com/venta/terrenos/torreon' },\n      { zona: 'Centro', color: '#15467A', lat: 25.548, lng: -103.406, portal: 'Inmuebles24', tipo: 'Residencial', precio: 5750, m2: 500, publicado: '08/06/2026', url: 'https://www.inmuebles24.com/terrenos-en-venta-en-torreon.html' },\n      { zona: 'Norte', color: '#E95026', lat: 25.568, lng: -103.430, portal: 'Pincali', tipo: 'Residencial', precio: 6100, m2: 720, publicado: '18/06/2026', url: 'https://www.pincali.com/venta/terrenos/torreon' },\n      { zona: 'Norte', color: '#E95026', lat: 25.575, lng: -103.410, portal: 'Inmuebles24', tipo: 'Residencial', precio: 5890, m2: 640, publicado: '09/06/2026', url: 'https://www.inmuebles24.com/terrenos-en-venta-en-torreon.html' },\n      { zona: 'Norte', color: '#E95026', lat: 25.560, lng: -103.440, portal: 'Pincali', tipo: 'Urbano', precio: 5700, m2: 410, publicado: '28/06/2026', url: 'https://www.pincali.com/venta/terrenos/torreon' },\n      { zona: 'Norte', color: '#E95026', lat: 25.572, lng: -103.398, portal: 'Inmuebles24', tipo: 'Residencial', precio: 6050, m2: 580, publicado: '05/06/2026', url: 'https://www.inmuebles24.com/terrenos-en-venta-en-torreon.html' },\n      { zona: 'Sur', color: '#1A7A47', lat: 25.505, lng: -103.418, portal: 'Inmuebles24', tipo: 'Ejidal', precio: 2890, m2: 3200, publicado: '03/06/2026', url: 'https://www.inmuebles24.com/terrenos-en-venta-en-torreon.html' },\n      { zona: 'Sur', color: '#1A7A47', lat: 25.498, lng: -103.400, portal: 'Pincali', tipo: 'Urbano', precio: 3340, m2: 500, publicado: '27/06/2026', url: 'https://www.pincali.com/venta/terrenos/torreon' },\n      { zona: 'Sur', color: '#1A7A47', lat: 25.515, lng: -103.392, portal: 'Inmuebles24', tipo: 'Urbano', precio: 3210, m2: 470, publicado: '29/06/2026', url: 'https://www.inmuebles24.com/terrenos-en-venta-en-torreon.html' },\n      { zona: 'Este', color: '#C9881E', lat: 25.535, lng: -103.372, portal: 'Pincali', tipo: 'Comercial', precio: 4350, m2: 1150, publicado: '21/06/2026', url: 'https://www.pincali.com/venta/terrenos/torreon' },\n      { zona: 'Este', color: '#C9881E', lat: 25.548, lng: -103.365, portal: 'Inmuebles24', tipo: 'Comercial', precio: 4700, m2: 980, publicado: '15/06/2026', url: 'https://www.inmuebles24.com/terrenos-en-venta-en-torreon.html' },\n      { zona: 'Oeste', color: '#5B4B8A', lat: 25.527, lng: -103.452, portal: 'Inmuebles24', tipo: 'Rústico', precio: 3600, m2: 5000, publicado: '01/06/2026', url: 'https://www.inmuebles24.com/terrenos-en-venta-en-torreon.html' },\n      { zona: 'Oeste', color: '#5B4B8A', lat: 25.536, lng: -103.440, portal: 'Pincali', tipo: 'Urbano', precio: 3780, m2: 430, publicado: '19/06/2026', url: 'https://www.pincali.com/venta/terrenos/torreon' }\n    ];\n\n    // Capa de calor real (Leaflet.heat) — cada anuncio de ejemplo aporta un punto caliente,\n    // más puntos de relleno jitterados alrededor del centro de cada zona para dar textura de densidad.\n    const heatPoints = [];\n    ANUNCIOS_EJEMPLO.forEach(a => { const [lat, lng] = enLimite(a.lat, a.lng); heatPoints.push([lat, lng, 1]); });\n    ZONAS.forEach(z => {\n      const enZona = ANUNCIOS_EJEMPLO.filter(a => a.zona === z.nombre).length;\n      const relleno = Math.max(0, z.count - enZona) * 2;\n      for (let i = 0; i < relleno; i++) {\n        const lat = z.centro[0] + (Math.random() - 0.5) * 0.018;\n        const lng = z.centro[1] + (Math.random() - 0.5) * 0.026;\n        const [clat, clng] = enLimite(lat, lng);\n        heatPoints.push([clat, clng, 0.45 + Math.random() * 0.35]);\n      }\n    });\n    L.heatLayer(heatPoints, { radius: 32, blur: 26, maxZoom: 15, minOpacity: 0.35, gradient: { 0.2: '#c9d9ea', 0.4: '#7fa8cf', 0.6: '#e9a26f', 0.8: '#E95026', 1.0: '#b5341a' } }).addTo(mapa);\n\n    // Líneas divisorias por sector, encima del calor: solo contorno, sin relleno, para no tapar el mapa de calor.\n    ZONAS.forEach(z => {\n      L.polygon(z.coords, { color: z.color, weight: 2.5, opacity: 0.85, fill: false, lineJoin: 'round' }).addTo(mapa);\n    });\n\n    // Marcadores de pulso lento (~1.8s) por anuncio de ejemplo, coloreados por zona, con popup y liga al anuncio original.\n    ANUNCIOS_EJEMPLO.forEach(a => {\n      const [lat, lng] = enLimite(a.lat, a.lng);\n      const icon = L.divIcon({\n        className: 'anuncio-pulso',\n        html: `<div style=\"position:relative;width:14px;height:14px\">\n          <div style=\"position:absolute;inset:0;border-radius:50%;background:${a.color};opacity:.55;animation:pulseRing 1800ms ease-out infinite\"><\u002Fdiv>\n          <div style=\"position:absolute;inset:0;border-radius:50%;background:${a.color};opacity:.55;animation:pulseRing 1800ms ease-out infinite;animation-delay:900ms\"><\u002Fdiv>\n          <div style=\"position:absolute;left:3px;top:3px;width:8px;height:8px;border-radius:50%;background:${a.color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)\"><\u002Fdiv>\n        <\u002Fdiv>`,\n        iconSize: [14, 14],\n        iconAnchor: [7, 7]\n      });\n      L.marker([lat, lng], { icon }).addTo(mapa).bindPopup(`<div style=\"font-family:'Libre Franklin',sans-serif;min-width:180px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\">\n          <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:${a.color}\">${a.zona}<\u002Fspan>\n          <span style=\"font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:8px;background:#F2EEE8;color:#5C554D\">${a.portal}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:1.05rem;color:#1B1714;margin-bottom:2px\">$${a.precio.toLocaleString('es-MX')} /m²<\u002Fdiv>\n        <div style=\"font-size:.76rem;color:#5C554D;margin-bottom:8px\">${a.tipo} · ${a.m2.toLocaleString('es-MX')} m² · Publicado ${a.publicado}<\u002Fdiv>\n        <a href=\"${a.url}\" target=\"_blank\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;color:#fff;background:${a.color};padding:7px 12px;border-radius:8px;text-decoration:none\">Ver anuncio ↗<\u002Fa>\n      <\u002Fdiv>`);\n    });\n\n  }\n\n  initCharts() {\n    const Chart = window.Chart;\n    Chart.defaults.font.family = \"'Libre Franklin', system-ui, sans-serif\";\n    Chart.defaults.color = '#5C554D';\n    const PESO = \"700 12px Archivo, sans-serif\";\n    const fmtMXN = v => '$' + Number(v).toLocaleString('es-MX');\n    const tooltipStyle = { backgroundColor: '#171310', titleColor: '#fff', bodyColor: '#E8E2DC', padding: 12, cornerRadius: 10, displayColors: false, borderColor: 'rgba(233,80,38,.4)', borderWidth: 1, titleFont: { family: 'Archivo', weight: '700', size: 13 }, bodyFont: { size: 12.5 } };\n    const ANIM = { duration: 900, easing: 'easeOutQuart' };\n    function valueLabels(formatter) {\n      return { id: 'vl', afterDatasetsDraw(chart) {\n        const { ctx } = chart; const meta = chart.getDatasetMeta(0);\n        meta.data.forEach((bar, i) => {\n          const v = chart.data.datasets[0].data[i];\n          ctx.save(); ctx.fillStyle = '#1B1714'; ctx.font = PESO; ctx.textAlign = 'center';\n          ctx.fillText(formatter(v), bar.x, bar.y - 9); ctx.restore();\n        });\n      } };\n    }\n\n    const elZonas = document.getElementById('cZonas');\n    if (elZonas && !elZonas._rendered) {\n      elZonas._rendered = true;\n      const labels = ['Centro', 'Norte', 'Sur', 'Este', 'Oeste'];\n      const values = [5320, 5890, 3150, 4200, 3780];\n      const colores = ['#15467A', '#E95026', '#1A7A47', '#C9881E', '#5B4B8A'];\n      new Chart(elZonas, { type: 'bar',\n        data: { labels, datasets: [{ data: values, backgroundColor: colores, borderRadius: 10, borderSkipped: false, maxBarThickness: 56 }] },\n        options: { responsive: true, maintainAspectRatio: false, animation: ANIM, layout: { padding: { top: 22 } },\n          plugins: { legend: { display: false }, tooltip: { ...tooltipStyle, callbacks: { label: c => ' ' + fmtMXN(c.parsed.y) + ' /m²' } } },\n          scales: { y: { beginAtZero: true, border: { display: false }, ticks: { callback: v => '$' + (v / 1000) + 'k', color: '#8A8178' }, grid: { color: '#EFEAE3' } }, x: { border: { display: false }, grid: { display: false }, ticks: { font: { weight: '600' } } } } },\n        plugins: [valueLabels(v => fmtMXN(v))] });\n    }\n\n    const elTamano = document.getElementById('cTamano');\n    if (elTamano && !elTamano._rendered) {\n      elTamano._rendered = true;\n      const labels = ['0–300 m²', '300–1,000 m²', '1,000–9,999 m²', '≥10,000 m²'];\n      const values = [8, 14, 8, 4];\n      const colores = ['#15467A', '#1A7A47', '#C9881E', '#E95026'];\n      new Chart(elTamano, { type: 'bar',\n        data: { labels, datasets: [{ data: values, backgroundColor: colores, borderRadius: 10, borderSkipped: false, maxBarThickness: 56 }] },\n        options: { responsive: true, maintainAspectRatio: false, animation: ANIM, layout: { padding: { top: 22 } },\n          plugins: { legend: { display: false }, tooltip: { ...tooltipStyle, callbacks: { label: c => ' ' + c.parsed.y + ' anuncios' } } },\n          scales: { y: { beginAtZero: true, border: { display: false }, ticks: { stepSize: 3, precision: 0, color: '#8A8178' }, grid: { color: '#EFEAE3' } }, x: { border: { display: false }, grid: { display: false }, ticks: { font: { size: 10.5, weight: '600' } } } } },\n        plugins: [valueLabels(v => v)] });\n    }\n\n    const elTipo = document.getElementById('cTipo');\n    if (elTipo && !elTipo._rendered) {\n      elTipo._rendered = true;\n      const labels = ['Urbano', 'Residencial', 'Comercial'];\n      const values = [16, 12, 6];\n      const colores = ['#15467A', '#1A7A47', '#E95026'];\n      new Chart(elTipo, { type: 'bar',\n        data: { labels, datasets: [{ data: values, backgroundColor: colores, borderRadius: 10, borderSkipped: false, maxBarThickness: 70 }] },\n        options: { responsive: true, maintainAspectRatio: false, animation: ANIM, layout: { padding: { top: 22 } },\n          plugins: { legend: { display: false }, tooltip: { ...tooltipStyle, callbacks: { label: c => ' ' + c.parsed.y + ' anuncios' } } },\n          scales: { y: { beginAtZero: true, border: { display: false }, ticks: { stepSize: 4, precision: 0, color: '#8A8178' }, grid: { color: '#EFEAE3' } }, x: { border: { display: false }, grid: { display: false }, ticks: { font: { weight: '600' } } } } },\n        plugins: [valueLabels(v => v)] });\n    }\n\n    const elPortales = document.getElementById('cPortales');\n    if (elPortales && !elPortales._rendered) {\n      elPortales._rendered = true;\n      const labels = ['Inmuebles24', 'Pincali'];\n      const values = [19, 15];\n      const colores = ['#15467A', '#E95026'];\n      new Chart(elPortales, { type: 'doughnut',\n        data: { labels, datasets: [{ data: values, backgroundColor: colores, borderWidth: 3, borderColor: '#fff', hoverOffset: 10, spacing: 2 }] },\n        options: { responsive: true, maintainAspectRatio: false, animation: { ...ANIM, animateRotate: true }, cutout: '66%',\n          plugins: { legend: { position: 'bottom', labels: { padding: 14, boxWidth: 9, boxHeight: 9, usePointStyle: true, font: { size: 11 } } }, tooltip: { ...tooltipStyle, callbacks: { label: c => ' ' + c.label + ': ' + c.parsed + ' anuncios' } } } },\n        plugins: [{ id: 'center', afterDraw(chart) {\n          const { ctx, chartArea: { left, top, width, height } } = chart;\n          const cx = left + width / 2, cy = top + height / 2;\n          ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n          ctx.fillStyle = '#1B1714'; ctx.font = '800 30px Archivo, sans-serif'; ctx.fillText('34', cx, cy - 8);\n          ctx.fillStyle = '#8A8178'; ctx.font = '600 11px Libre Franklin, sans-serif'; ctx.fillText('anuncios', cx, cy + 15);\n          ctx.restore();\n        } }] });\n    }\n\n    const elTendencia = document.getElementById('cTendencia');\n    if (elTendencia && !elTendencia._rendered) {\n      elTendencia._rendered = true;\n      const labels = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'];\n      const values = [4520, 4560, 4610, 4680, 4720, 4740];\n      new Chart(elTendencia, { type: 'line',\n        data: { labels, datasets: [{ data: values, borderColor: '#E95026', borderWidth: 3, tension: .4, fill: true,\n          pointBackgroundColor: '#fff', pointBorderColor: '#E95026', pointBorderWidth: 2.5, pointRadius: 5, pointHoverRadius: 7,\n          backgroundColor: (c) => { const a = c.chart.chartArea; if (!a) return 'rgba(233,80,38,.12)'; const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom); g.addColorStop(0, 'rgba(233,80,38,.30)'); g.addColorStop(1, 'rgba(233,80,38,0)'); return g; } }] },\n        options: { responsive: true, maintainAspectRatio: false, animation: ANIM,\n          plugins: { legend: { display: false }, tooltip: { ...tooltipStyle, callbacks: { label: c => ' ' + fmtMXN(c.parsed.y) + ' /m²' } } },\n          scales: { y: { min: 4400, max: 4800, border: { display: false }, ticks: { callback: v => '$' + v.toLocaleString('es-MX'), color: '#8A8178' }, grid: { color: '#EFEAE3' } }, x: { border: { display: false }, grid: { display: false }, ticks: { font: { weight: '600' } } } } } });\n    }\n  }\n\n  renderVals() {\n    return {\n      showNota: this.props.mostrarNotaAlcance ?? true\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
